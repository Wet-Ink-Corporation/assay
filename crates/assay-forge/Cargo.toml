# GitHub's JSON: wire DTOs read through assay-app's duplicate-key-refusing parse, request bodies (#53).
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Property tests: path resolution against its reference reading (#184).
proptest = { workspace = true }
