# assay's own additions to the shipped glob lists (docs/architecture/03-contracts.md §1,
# 04-pipeline.md §2.2). Read from the base commit only; each list only adds to the shipped one.
#
# T16 (02 §7, 05 T16): assay gates assay, so everything that decides a verdict is a trust path
# and needs owner approval (rubric rule 4). `.github/workflows/release.yml`, `.assay/**` and
# `deny.toml` are already shipped trust paths; they are listed again so this file states 02 §7
# whole. `corpus/golden/**` goes beyond 02 §7's list: the `assay-self` gate passes a verdict
# change only when the PR updates its snapshot, and the snapshot update is what the owner
# approves, whatever caused it (fail-closed reading, wi-b5affa; owner to confirm).
# `corpus/{dev,test,inject}/**` (owner, #230): the replay gate accepts a prompt or rubric PR by
# its result on these cases, so a PR that could edit their labels could grade itself.
# `plugin-mod/**`: the assay mod's own plugin (ADR-25), split from `plugin/` because desktop chats
# switch off a plugin that ships a mod; it is the same trust path as `plugin/**`.
trust = [
    "crates/**",
    "rubric/**",
    "plugin/**",
    "plugin-mod/**",
    "schemas/**",
    "workflows/**",
    ".github/workflows/release.yml",
    ".assay/**",
    "deny.toml",
    "corpus/golden/**",
    "corpus/dev/**",
    "corpus/test/**",
    "corpus/inject/**",
]
