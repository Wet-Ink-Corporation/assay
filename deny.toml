# cargo-deny policy (ARC-12). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0",
]
# assay's own crates are private (publish = false) and carry no license field (AGENTS.md).
# Every third-party crate is still checked against `allow`.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # unpublished workspace path dependencies carry no version
highlight = "all"
deny = [
  # Banned as direct dependencies. `wrappers` lists the crates in the pre-approved set's tree
  # that still use them. When a newly approved dependency pulls one in (`cargo tree -i <crate>`),
  # add the crate that uses it here as part of that H-16 decision.
  { name = "lazy_static", wrappers = ["sharded-slab"], reason = "MOD-03: use std::sync::LazyLock" },
  { name = "once_cell", wrappers = ["insta", "tempfile", "tracing-core", "tracing-log", "tracing-subscriber"], reason = "MOD-03: use std::sync::{OnceLock, LazyLock}" },
  { name = "failure", reason = "unmaintained; use thiserror" },
  { name = "error-chain", reason = "unmaintained; use thiserror" },
  # P8: assay consumes Weigh-In through its documented contract and never links its crates.
  # The architecture test (crates/assay-cli/tests/it/architecture.rs) also rejects temper code.
  { name = "weighin-core", reason = "P8: consume Weigh-In through contracts, never link it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
